name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test all loaders
        run: ./gradlew build --console=plain

      - name: Benchmark the runtime
        run: |
          ./gradlew :common:bench --console=plain
          {
            echo '### Runtime benchmark'
            echo 'The baseline was recorded on a dev machine, so compare runs of this job with each other, not with it.'
            echo
            cat common/build/bench/results.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/tests/
            common/build/reports/jacoco/

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
            !*/build/libs/*-javadoc.jar

  server-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Start a dedicated server and run the smoke test
        env:
          ACCEPT_EULA: 'true'
        run: scripts/smoke-server.sh ${{ matrix.loader }}

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.loader }}
          path: ${{ matrix.loader }}/runs/smoke/smoke-output.log
