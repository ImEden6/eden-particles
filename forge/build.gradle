plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
}

tasks.named('jar', Jar) {
    manifest {
        // Mixin finds our configs through the manifest.
        attributes['MixinConfigs'] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            args "--mixin.config=${mod_id}.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json"
        }
        register('client') {
            workingDir = file('runs/client')
            // Dev demo: ./gradlew :forge:runClient -Pdemo=<effect id>
            if (project.hasProperty('demo')) systemProperty 'eden_particles.demo', project.property('demo').toString()
            // Dev: -Pjoin=localhost connects straight to a server
            if (project.hasProperty('join')) args '--quickPlayMultiplayer', project.property('join').toString()
        }
        register('server') {
            workingDir = file('runs/server')
            args '--nogui'
        }
        // scripts/smoke-server.sh
        register('smokeServer') {
            workingDir = file('runs/smoke')
            systemProperty 'eden_particles.smoke', 'true'
            args '--nogui'
        }
        register('data') {
            workingDir = file('runs/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
// Forge's dev launcher treats separate class and resource folders as two modules, so put both in one.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Something else pulls in jopt-simple 6, which isn't the 'jopt.simple' module modlauncher needs.
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights_version}") {
        attributes { attribute(Attribute.of('net.minecraft.mappings', String), 'mojmap') }
    }
}

// Consumers bring their own Forge, so the published metadata shouldn't depend on it.
tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }
publishing.publications.named('mavenJava', MavenPublication) {
    pom.withXml {
        asNode().dependencies.dependency.findAll { it.groupId.text() == 'net.minecraftforge' }.each { it.parent().remove(it) }
    }
}
