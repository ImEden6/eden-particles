plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

dependencies {
    // Compatibility testing only: ./gradlew :fabric:runClient -PwithSodium (or -PwithIris for both)
    if (project.hasProperty('withSodium') || project.hasProperty('withIris')) {
        modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    }
    if (project.hasProperty('withIris')) {
        modLocalRuntime "maven.modrinth:iris:${iris_version}"
        // Iris nests these in its jar, but nested jars aren't loaded from a dev dependency.
        localRuntime 'org.anarres:jcpp:1.4.14'
        localRuntime 'io.github.douira:glsl-transformer:2.0.1'
        localRuntime 'org.antlr:antlr4-runtime:4.13.1'
    }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            // Dev demo: ./gradlew :fabric:runClient -Pdemo=<effect id>
            if (project.hasProperty('demo')) vmArg("-Deden_particles.demo=${project.property('demo')}")
            // Dev: ./gradlew :fabric:runClient -Pjoin=localhost connects straight to a server
            if (project.hasProperty('join')) programArgs('--quickPlayMultiplayer', project.property('join').toString())
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}